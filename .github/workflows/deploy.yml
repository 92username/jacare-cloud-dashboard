name: Deploy manual jacare.cloud

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: SHA completo da imagem já publicada no GHCR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-jacare-cloud
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar imagem na VPS
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Validar tag solicitada
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: '[[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Preparar chave SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Aplicar imagem e verificar health check
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/local/bin/jacare-container-deploy.sh '$IMAGE_SHA'"

      - name: Conferir publicação externa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://jacare.cloud/healthz
